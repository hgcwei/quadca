<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pairwise 组合测试用例生成器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
       background: linear-gradient(135deg, #f0f4ff 0%, #e8ecf4 100%);
       min-height: 100vh; padding: 40px 20px; }
.container { max-width: 860px; margin: 0 auto; }
.card { background: #fff; border-radius: 16px; padding: 36px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06); margin-bottom: 24px; }
h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 8px; }
.subtitle { color: #6b7280; font-size: 15px; margin-bottom: 20px; }
textarea { width: 100%; height: 180px; font-family: monospace; font-size: 14px; padding: 14px;
           border: 1.5px solid #d1d5db; border-radius: 10px; }
textarea:focus { outline: none; border-color: #4f46e5; }
.btn-row { display: flex; gap: 12px; margin-top: 16px; }
.btn { border: none; padding: 12px 36px; font-size: 16px; border-radius: 10px; cursor: pointer; font-weight: 500; }
.btn-primary { background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-secondary { background: #fff; color: #374151; border: 1.5px solid #d1d5db; }
pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; font-size: 13px; max-height: 400px; overflow-y: auto; }
.footer { text-align: center; color: #9ca3af; font-size: 13px; padding: 20px; }
#result { display: none; }
#result.show { display: block; }
.loading { display: none; color: #4f46e5; margin: 12px 0; font-weight: bold; }
.loading.show { display: block; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🧪 Pairwise 组合测试用例生成器</h1>
        <p class="subtitle">自动生成覆盖所有成对组合（正交/Pairwise）的测试用例</p>
        <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:14px;color:#92400e;font-size:14px;margin:12px 0;">
            <strong>💡 输入格式：</strong>第一行因子名，后续每行每个因子的水平值
        </div>
        <h3>⌨️ 粘贴CSV内容</h3>
        <form id="csvForm" onsubmit="return submitForm(event)">
            <textarea id="csvText" placeholder="Browser,OS,Language,Screen&#10;Chrome,Windows,English,1080p&#10;Firefox,macOS,Chinese,720p&#10;Safari,Linux,Japanese,4K&#10;Edge,,French,"></textarea>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary">🚀 生成测试用例</button>
                <button type="button" class="btn btn-secondary" onclick="loadExample()">📋 加载示例</button>
            </div>
        </form>
    </div>
    <div id="loading" class="loading">⏳ 正在计算优化用例集，请稍候...</div>
    <div id="result" class="card">
        <h3>✅ 生成结果</h3>
        <div class="btn-row" style="margin-bottom:12px">
            <a id="downloadLink" class="btn btn-primary" style="text-decoration:none">⬇️ 下载 CSV 文件</a>
            <button class="btn btn-secondary" onclick="copyResult()">📋 复制文本</button>
        </div>
        <pre id="resultContent"></pre>
    </div>
    <div class="footer">Powered by QuadCA · 阿里云函数计算 Serverless 驱动</div>
</div>
<script>
// 云函数后端 API 触发器公网地址
const FC_API_URL = 'https://quadca-wmmctsihdy.cn-hangzhou.fcapp.run';

function loadExample() {
    document.getElementById('csvText').value =
        'Browser,OS,Language,Screen\nChrome,Windows,English,1080p\nFirefox,macOS,Chinese,720p\nSafari,Linux,Japanese,4K\nEdge,,French,';
}

async function submitForm(e) {
    e.preventDefault();
    var csv = document.getElementById('csvText').value.trim();
    if (!csv) { alert('请先输入CSV内容'); return false; }

    document.getElementById('loading').classList.add('show');
    document.getElementById('result').classList.remove('show');

    try {
        var resp = await fetch(FC_API_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({csv: csv})
        });

        var text = await resp.text();

        // 校验是否返回错误 JSON
        try {
            var json = JSON.parse(text);
            if (json.error) throw new Error(json.error);
        } catch(ex) {
            if (ex.message && !ex.message.includes('JSON')) throw ex;
        }

        document.getElementById('resultContent').textContent = text;
        var blob = new Blob([text], {type: 'text/csv'});
        document.getElementById('downloadLink').href = URL.createObjectURL(blob);
        document.getElementById('downloadLink').download = 'test_cases.csv';
        document.getElementById('result').classList.add('show');
    } catch(ex) {
        document.getElementById('resultContent').textContent = '❌ 发生错误: ' + ex.message;
        document.getElementById('result').classList.add('show');
    } finally {
        document.getElementById('loading').classList.remove('show');
    }
    return false;
}

function copyResult() {
    var text = document.getElementById('resultContent').textContent;
    navigator.clipboard.writeText(text).then(()=>alert('已成功复制到剪贴板')).catch(()=>alert('复制失败'));
}
</script>
</body>
</html>
